<body>
<main><div><h1>ODYSSEY<small>帰路</small></h1><p id="state" role="status" aria-live="polite"></p></div></main>
<script>
// Fixed entrance. The game runs on one Mac and gets a new address each time it is started;
// status.json next to this page holds the current one. When the game answers, go straight in.
const state = document.getElementById('state');
const addressPattern = /^https:\/\/[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.trycloudflare\.com$/;
let entering = false;
async function look() {
  if (entering) return;
  try {
    const response = await fetch('status.json?t=' + Date.now(), { cache: 'no-store', signal: AbortSignal.timeout(8000) });
    const door = response.ok ? await response.json() : null;
    if (door && ['ready', 'streaming'].includes(door.status) && addressPattern.test(door.url)) {
      const answer = await fetch(door.url + '/alive', { cache: 'no-store', signal: AbortSignal.timeout(9000) });
      if (answer.ok && (await answer.text()) === 'odyssey-alive') {
        entering = true;
        location.replace(door.url + '/');
        return;
      }
    }
  } catch { /* closed or unreachable: same thing for a visitor */ }
  state.textContent = 'いまは閉まっています';
}
look();
setInterval(() => { if (!document.hidden) look(); }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) look(); });
</script>
</body>
