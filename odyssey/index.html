<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ODYSSEY</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
} }
</script>
<style>
  :root {
    --ink: #efe6d6; --ink-dim: rgba(239,230,214,.6); --bronze: #c9a066; --bronze-dim: rgba(201,160,102,.34);
    --panel: rgba(14,11,9,.46); --hp: #b8402e; --hp-rec: #5e2620; --st: #c6a14c; --boss: #a33a25;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0a09; overflow: hidden; color: var(--ink); font-family: "Hiragino Sans", system-ui, sans-serif; }
  canvas#game { display: block; width: 100vw; height: 100vh; }
  .hidden { display: none !important; }
  #hud { position: fixed; inset: 0; pointer-events: none; user-select: none; }
  #vitals { position: absolute; left: 22px; top: 20px; width: 250px; }
  .bar { position: relative; height: 8px; background: rgba(0,0,0,.42); overflow: hidden; border-radius: 1px; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .bar + .bar { margin-top: 5px; }
  .bar .fill, .bar .rec, .bar .lag { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform-origin: left center; }
  .hp .fill { background: linear-gradient(#cc5640, var(--hp)); }
  .hp .rec { background: var(--hp-rec); }
  .st { height: 4px; width: 78%; }
  .st .fill { background: var(--st); }
  .st.low .fill { background: #8d6b2c; }
  #boss { position: absolute; left: 50%; top: 24px; transform: translateX(-50%); width: min(520px, 60vw); }
  #boss .eye { width: 22px; height: 12px; margin: 0 auto 6px; display: block; opacity: .85; }
  #boss .bar { height: 7px; background: rgba(0,0,0,.55); box-shadow: 0 0 0 1px var(--bronze-dim); }
  #boss .fill { background: linear-gradient(#b8492f, var(--boss)); }
  #boss .lag { background: #e3c9a0; opacity: .5; }
  #minimap { position: absolute; right: 22px; top: 20px; width: 168px; height: 168px; border-radius: 50%; box-shadow: 0 0 0 1px var(--bronze-dim); background: rgba(10,8,6,.45); }
  #flash { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(120,10,0,0) 40%, rgba(140,16,6,.7) 100%); opacity: 0; }
  #keys { position: absolute; left: 22px; bottom: 20px; display: flex; gap: 14px; align-items: flex-end; transition: opacity 1.2s; }
  #keys.dim { opacity: .38; }
  .k { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .k .caps { display: flex; gap: 3px; align-items: flex-end; }
  .cap { min-width: 22px; height: 22px; padding: 0 5px; border: 1px solid rgba(239,230,214,.55); border-bottom-width: 2px; border-radius: 4px; display: grid; place-items: center; font: 600 11px/1 ui-monospace, Menlo, monospace; color: var(--ink); background: rgba(10,8,6,.35); }
  .cap.wide { min-width: 52px; }
  .cap svg { width: 13px; height: 13px; }
  .k .ico { width: 18px; height: 18px; opacity: .8; }
  #prompt { position: absolute; left: 50%; top: 62%; transform: translateX(-50%); }
  #mute { pointer-events: auto; position: absolute; right: 22px; bottom: 20px; width: 32px; height: 32px; border-radius: 50%; color: var(--ink-dim); cursor: pointer; display: grid; place-items: center; padding: 0; background: var(--panel); border: 1px solid var(--bronze-dim); }
  #mute svg { width: 15px; height: 15px; }
  #mute.off .wave { display: none; }
  #mute:not(.off) .x { display: none; }
  #credits-hud { pointer-events: auto; position: absolute; right: 62px; bottom: 20px; width: 32px; height: 32px; border-radius: 50%; color: var(--ink-dim); cursor: pointer; display: grid; place-items: center; padding: 0; background: var(--panel); border: 1px solid var(--bronze-dim); }
  #credits-hud svg { width: 15px; height: 15px; }
  #stats { position: absolute; right: 104px; bottom: 26px; font: 11px ui-monospace, Menlo, monospace; color: rgba(239,230,214,.4); }
  #loading { position: fixed; left: 50%; bottom: 14vh; width: 220px; height: 2px; margin-left: -110px; background: rgba(239,230,214,.15); }
  #loading div { height: 100%; width: 0; background: var(--bronze); transition: width .2s; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .card { background: radial-gradient(ellipse at 50% 50%, rgba(8,6,5,.66) 0%, rgba(8,6,5,.44) 50%, rgba(8,6,5,.16) 100%); }
  .card .rows { display: grid; grid-template-columns: auto auto; gap: 10px 22px; margin: 0 0 30px; font-size: 18px; font-variant-numeric: tabular-nums; align-items: center; }
  .card .rows svg { width: 22px; height: 22px; opacity: .85; justify-self: end; }
  .card .rows span { justify-self: start; }
  .card .btns { display: flex; gap: 14px; }
  .card button, .iconbtn { pointer-events: auto; width: 46px; height: 46px; border-radius: 50%; background: var(--panel); border: 1px solid var(--bronze-dim); color: var(--ink); cursor: pointer; display: grid; place-items: center; padding: 0; }
  .card button:hover { border-color: var(--bronze); }
  .card button svg { width: 20px; height: 20px; }
  #credits { background: rgba(8,6,5,.82); }
  #credits .list { max-width: 760px; max-height: 70vh; overflow: auto; text-align: left; font-size: 12px; line-height: 1.7; color: var(--ink-dim); padding: 0 24px; }
  #credits .list b { color: var(--ink); font-weight: 600; }
  #credits button { margin-top: 18px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="loading"><div></div></div>

<div id="hud">
  <div id="vitals">
    <div class="bar hp"><div class="rec"></div><div class="fill"></div></div>
    <div class="bar st"><div class="fill"></div></div>
  </div>
  <div id="boss" class="hidden">
    <svg class="eye" viewBox="0 0 22 12" fill="none" stroke="#e8cf9e" stroke-width="1.4"><path d="M1 6c3-4.5 17-4.5 20 0-3 4.5-17 4.5-20 0z"/><circle cx="11" cy="6" r="2.6" fill="#e8cf9e" stroke="none"/></svg>
    <div class="bar"><div class="lag"></div><div class="fill"></div></div>
  </div>
  <canvas id="minimap" width="336" height="336"></canvas>
  <div id="prompt" class="hidden"><span class="cap">E</span></div>
  <div id="flash"></div>
  <div id="keys">
    <div class="k"><div class="caps"><span class="cap">W</span></div><div class="caps"><span class="cap">A</span><span class="cap">S</span><span class="cap">D</span></div></div>
    <div class="k"><span class="cap wide"><svg viewBox="0 0 14 14" fill="currentColor"><path d="M7 2l5 5H9v5H5V7H2z"/></svg></span><svg class="ico" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 9h9M9 5l4 4-4 4M1 6h3M1 12h3"/></svg></div>
    <div class="k"><span class="cap wide" style="min-width:64px"></span><svg class="ico" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="9" cy="10" r="4.2"/><path d="M3 6a7 7 0 0 1 12 0M13 3l2 3-3.2.6"/></svg></div>
    <div class="k"><span class="cap"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="1.5" width="8" height="11" rx="4"/><path d="M7 1.5v4.5"/><path d="M3.2 6h3.8V1.6A4 4 0 0 0 3.2 5z" fill="currentColor"/></svg></span><svg class="ico" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 15l9-9M11 3l4 4M12 6l2-2M5 11l2 2"/></svg></div>
    <div class="k"><span class="cap"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="1.5" width="8" height="11" rx="4"/><path d="M7 1.5v4.5"/><path d="M10.8 6H7V1.6A4 4 0 0 1 10.8 5z" fill="currentColor"/></svg></span><svg class="ico" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="9" cy="9" r="6.5"/><circle cx="9" cy="9" r="2"/></svg></div>
    <div class="k"><span class="cap">F</span><svg class="ico" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 16l10-10M10 3l5 5M12 6l3-3M4 12l2 2"/><path d="M1 9h4M9 1v4" stroke-dasharray="1.5 1.5"/></svg></div>
    <div class="k"><span class="cap">Q</span><svg class="ico" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="9" cy="9" r="3"/><path d="M9 1v4M9 13v4M1 9h4M13 9h4"/></svg></div>
  </div>
  <div id="stats"></div>
  <button id="credits-hud" class="credits-open" aria-label="credits"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7.5"/><path d="M12.6 7.6a3.4 3.4 0 1 0 0 4.8"/></svg></button>
  <button id="mute" title="M" aria-label="mute">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor" stroke="none"/><path class="wave" d="M11 5.5c1 .8 1 4.2 0 5M12.8 4c1.8 1.6 1.8 6.4 0 8"/><path class="x" d="M11 6l4 4M15 6l-4 4"/></svg>
  </button>
</div>

<div id="dead" class="overlay card hidden">
  <div class="btns"><button id="retry" aria-label="retry"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M16 10a6 6 0 1 1-2-4.5"/><path d="M14.5 2.5v3.5H11"/></svg></button>
    <button class="credits-open" aria-label="credits"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7.5"/><path d="M12.6 7.6a3.4 3.4 0 1 0 0 4.8"/></svg></button></div>
</div>

<div id="win" class="overlay card hidden">
  <div class="rows" id="win-rows"></div>
  <div class="btns">
    <button id="again" aria-label="again"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M16 10a6 6 0 1 1-2-4.5"/><path d="M14.5 2.5v3.5H11"/></svg></button>
    <button id="credits-btn" aria-label="credits"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7.5"/><path d="M12.6 7.6a3.4 3.4 0 1 0 0 4.8"/></svg></button>
  </div>
</div>

<div id="credits" class="overlay hidden">
  <div class="list" id="credits-list"></div>
  <button id="credits-close" class="iconbtn" aria-label="close"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
